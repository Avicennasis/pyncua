# See https://pre-commit.com for usage and https://pre-commit.com/hooks.html for more hooks.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep EXACTLY in step with the ruff pin in pyproject.toml's `dev` extra.
    # renovate.json groups this rev and that pin into one PR so they cannot
    # drift again; if you bump either by hand, bump both. Divergence means
    # pre-commit and CI silently enforce different rule sets.
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # py_compile catches syntax errors in files ruff isn't run against
  # (worker scripts, one-off scripts/, tooling). Cheap, no installs needed.
  - repo: local
    hooks:
      - id: py-compile
        name: python parse-check (py_compile)
        entry: python3 -m py_compile
        language: system
        types: [python]
        require_serial: false
