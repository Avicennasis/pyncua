[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyncua"
version = "1.1.0"
description = "Python client for the NCUA Credit Union Mapping API"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Léon Simmons", email = "Avicennasis@gmail.com"},
]
keywords = ["ncua", "credit-union", "api", "finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
readme = "README.md"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
]

[project.urls]
Homepage = "https://github.com/Avicennasis/pyncua"
Repository = "https://github.com/Avicennasis/pyncua"
Issues = "https://github.com/Avicennasis/pyncua/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    # Pinned, not floating. Keep EXACTLY in step with the ruff-pre-commit `rev`
    # in .pre-commit-config.yaml and with uv.lock. renovate.json groups all of
    # them into a single PR (matchManagers pep621 + pre-commit), which is the
    # guard against the 2026-07-29 failure: a bare `pip install ruff` in CI
    # raced an older pre-commit rev, so the two gates enforced different rules
    # and CI went red with no PR at fault. Bumping to 0.16.x also turns on
    # formatting of Python code blocks inside Markdown — README.md and docs/
    # are formatted accordingly, so a downgrade will report them as unformatted.
    "ruff==0.16.4",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: hits the real NCUA API (deselect with '-m not live')",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/pyncua"]
